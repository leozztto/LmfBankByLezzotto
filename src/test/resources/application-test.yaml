# Profile used by integration tests. The datasource is supplied at runtime by the
# Testcontainers PostgreSQL instance (see PostgresContainerSupport), so no url/user here.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: localhost:9092
    # Never open a real broker connection during tests.
    listener:
      auto-startup: false

jwt:
  secret: test-secret-key-with-at-least-32-characters-long
  expiration: 3600000

logging:
  level:
    root: WARN
    org.testcontainers: INFO
    com.lezztto.LmfBank: INFO
