name: frontend-ci

# Reutilizável (ADR 0006). Chamado por ci.yml quando `frontend/**` muda.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lint, test & analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Obrigatório no modelo unificado SonarQube Server/Cloud.
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ANALYZED_BRANCH: ${{ vars.SONAR_ANALYZED_BRANCH || 'main' }}
      IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'          # bate com frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage     # -> frontend/coverage/lcov.info

      - name: Build
        run: npm run build             # next build (output standalone)

      - name: Check SonarCloud configuration
        if: >-
          ${{ env.IS_FORK_PR != 'true'
          && (github.event_name == 'pull_request'
          || github.ref == format('refs/heads/{0}', env.SONAR_ANALYZED_BRANCH)) }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is not set."
            exit 1
          fi

      - name: SonarCloud analysis
        # Coordenadas (org/projectKey) vêm de frontend/sonar-project.properties.
        if: >-
          ${{ env.IS_FORK_PR != 'true'
          && (github.event_name == 'pull_request'
          || github.ref == format('refs/heads/{0}', env.SONAR_ANALYZED_BRANCH)) }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: frontend
          args: -Dsonar.qualitygate.wait=true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
