name: frontend-ci

# Reutilizável (ADR 0006). Chamado por ci.yml quando `frontend/**` muda.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lint, test & analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Obrigatório no modelo unificado SonarQube Server/Cloud.
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_ANALYZED_BRANCH: ${{ vars.SONAR_ANALYZED_BRANCH || 'main' }}
      IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc   # fonte única (bate com Dockerfile)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage     # -> frontend/coverage/lcov.info

      - name: Contract tests (consumer Pact)
        # Gera frontend/pact/pacts/*.json exercitando a camada BFF real (ADR 0008).
        run: npm run pact:test

      - name: Check Pact configuration
        # Mesmo princípio do check do Sonar: se a publicação é esperada mas o
        # PACT_BROKER_TOKEN sumiu, falhar de propósito — step pulado não pode
        # parecer verde.
        if: >-
          ${{ env.IS_FORK_PR != 'true'
          && (github.event_name == 'pull_request'
          || github.ref == 'refs/heads/main') }}
        run: |
          if [ -z "${{ secrets.PACT_BROKER_TOKEN }}" ]; then
            echo "::error::PACT_BROKER_TOKEN secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Publish pacts
        # PR de fork não tem secrets → pula (o pact do fork é verificado como WIP
        # depois que a branch entra). Publica com a versão = SHA e a branch do git.
        if: >-
          ${{ env.IS_FORK_PR != 'true'
          && (github.event_name == 'pull_request'
          || github.ref == 'refs/heads/main') }}
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL || secrets.PACT_BROKER_BASE_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PACT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >-
          npm run pact:publish --
          --consumer-app-version "$GITHUB_SHA"
          --branch "$PACT_BRANCH"

      - name: Build
        run: npm run build             # next build (output standalone)

      - name: Check SonarCloud configuration
        if: >-
          ${{ env.IS_FORK_PR != 'true'
          && (github.event_name == 'pull_request'
          || github.ref == format('refs/heads/{0}', env.SONAR_ANALYZED_BRANCH)) }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN secret is not set."
            exit 1
          fi

      - name: SonarCloud analysis
        # Coordenadas (org/projectKey) vêm de frontend/sonar-project.properties.
        if: >-
          ${{ env.IS_FORK_PR != 'true'
          && (github.event_name == 'pull_request'
          || github.ref == format('refs/heads/{0}', env.SONAR_ANALYZED_BRANCH)) }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: frontend
          args: -Dsonar.qualitygate.wait=true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
