name: CI

# Orquestrador (ADR 0006). Sem paths filter: sempre roda. O job `changes`
# (dorny/paths-filter) decide quais módulos rodam; `backend-ci.yml` e
# `frontend-ci.yml` são reutilizáveis (workflow_call). O job `ci` agrega os
# resultados e é o ÚNICO required status check nas branches protegidas.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # push: paths-filter faz git-diff contra github.event.before
          fetch-depth: 0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/ci.yml'

  backend:
    name: backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  frontend:
    name: frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  ci:
    # ÚNICO required status check. Reprova só se um módulo necessário falhar ou
    # for cancelado; `skipped` (módulo não mudou) conta como OK.
    name: ci
    needs: [changes, backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify module pipelines
        run: |
          echo "changes:  ${{ needs.changes.result }}"
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          fail=0
          for r in "${{ needs.changes.result }}" "${{ needs.backend.result }}" "${{ needs.frontend.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::CI dependency finished with '$r'"; fail=1 ;;
            esac
          done
          exit $fail
