# SonarCloud - módulo frontend (ADR 0002/0003/0006). O workflow passa
# projectBaseDir=frontend, portanto os paths abaixo são relativos a frontend/.
sonar.organization=leozztto
sonar.projectKey=leozztto_lmfbank-frontend
sonar.projectName=LmfBank Frontend
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.{test,spec}.{ts,tsx}
sonar.exclusions=src/**/*.{test,spec}.{ts,tsx}

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Next.js: arquivos-convenção do App Router e configs carregam pouca lógica testável.
sonar.coverage.exclusions=src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/**/not-found.tsx,src/app/**/template.tsx,src/app/**/route.ts,src/**/*.d.ts,*.config.{ts,js,mjs,cjs},vitest.setup.ts,next-env.d.ts
