# SonarCloud - módulo frontend (ADR 0002/0003/0006). O workflow passa
# projectBaseDir=frontend, portanto os paths abaixo são relativos a frontend/.
sonar.organization=leozztto
sonar.projectKey=leozztto_lmfbank-frontend
sonar.projectName=LmfBank Frontend
sonar.host.url=https://sonarcloud.io

# IMPORTANTE: os padrões de path do Sonar aceitam só *, ** e ? — NÃO há
# expansão de chaves {a,b}. Por isso cada extensão/sufixo é listado
# explicitamente. Um glob com {test,spec} não casava com nada e os arquivos
# de teste acabavam classificados como código de produção sem cobertura.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Só o layout raiz (fiação de next/font) e as primitivas shadcn ficam fora da
# cobertura — todo o resto de src/app (pages, layouts de rota, loading, error,
# not-found, providers, app-shell) passou a ter testes.
# NOTA: src/app/**/route.ts (o BFF) é código sensível de auth e tem testes.
sonar.coverage.exclusions=src/app/layout.tsx,src/components/ui/**,src/**/*.d.ts,*.config.ts,*.config.js,*.config.mjs,*.config.cjs,vitest.setup.ts,next-env.d.ts
