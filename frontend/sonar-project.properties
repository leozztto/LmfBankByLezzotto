# SonarCloud - módulo frontend (ADR 0002/0003/0006). O workflow passa
# projectBaseDir=frontend, portanto os paths abaixo são relativos a frontend/.
sonar.organization=leozztto
sonar.projectKey=leozztto_lmfbank-frontend
sonar.projectName=LmfBank Frontend
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.{test,spec}.{ts,tsx}
sonar.exclusions=src/**/*.{test,spec}.{ts,tsx},src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Convenção do App Router + composição pura + primitivas shadcn: pouca lógica testável.
# NOTA: src/app/**/route.ts (o BFF) NÃO é excluído — é código sensível de auth e tem testes.
sonar.coverage.exclusions=src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/**/global-error.tsx,src/app/**/not-found.tsx,src/app/**/template.tsx,src/app/**/page.tsx,src/app/providers.tsx,src/components/ui/**,src/components/app-shell.tsx,src/**/*.d.ts,*.config.{ts,js,mjs,cjs},vitest.setup.ts,next-env.d.ts
