events {}

http {
    upstream backend  { server backend:8080; }
    upstream frontend { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        # /api/* -> Spring Boot. A barra final no proxy_pass remove o prefixo /api,
        # então /api/actuator/health chega no backend como /actuator/health
        # (mesma origem -> sem CORS, ADR 0003).
        location /api/ {
            proxy_pass http://backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /api { return 308 /api/; }

        # Todo o resto -> Next.js (next start / node server.js na porta 3000).
        # O próprio processo Next serve /_next/static e os payloads RSC.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
